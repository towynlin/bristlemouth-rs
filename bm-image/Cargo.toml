[package]
name = "bm-image"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
license.workspace = true
publish = false
description = "Builds and reads the MCUboot images a Bristlemouth node boots: .dfu.bin and .unified.bin"

[dependencies]
bm-mcuboot = { path = "../bm-mcuboot" }
bm-wire = { path = "../bm-wire" }
ed25519-dalek = { version = "3", default-features = false, features = ["pkcs8", "pem", "alloc"] }
sha2 = { version = "0.11", default-features = false }

[dev-dependencies]
bm-mcuboot-diff = { path = "../bm-mcuboot-diff" }
bm-mcuboot-sys = { path = "../bm-mcuboot-sys" }
