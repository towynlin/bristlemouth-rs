[package]
name = "bm-wire"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
description = "Pure, safe, no_std Rust port of bm_core's wire format"

[features]
# Off by default: bm-wire must build for a bare-metal target untouched.
# Only test and fuzz builds turn this on.
default = []
std = []

[dependencies]
# The only dependency, and deliberate: config values are CBOR, and a
# hand-rolled codec is a worse bet than a maintained one. `default-features =
# false` keeps it `no_std` and alloc-free -- the `std` feature above must never
# forward to it, or firmware and tests would run different code. Only
# `cbor2::core`, its low-level header encoder/decoder, is used; the serde
# layer needs `alloc`.
cbor2 = { version = "1.1.5", default-features = false }
