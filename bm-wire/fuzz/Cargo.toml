[package]
name = "bm-wire-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

# Its own workspace: the fuzz profile and the nightly-only sanitizer flags must
# not leak into the outer workspace, and cargo-fuzz expects it this way.
[workspace]

[dependencies]
libfuzzer-sys = "0.4"
bm-wire-diff = { path = "../../bm-wire-diff" }

[[bin]]
name = "crc"
path = "fuzz_targets/crc.rs"
test = false
doc = false
bench = false

# tinycbor is pure -- no shim state, no allocation, no clock -- so this one
# needs nothing brought up and shares a process with anything.
[[bin]]
name = "cbor"
path = "fuzz_targets/cbor.rs"
test = false
doc = false
bench = false

# `configuration.c`'s `CONFIGS` and the shim's flash are process-global, and
# `check` resets both through `config_init` at the start of every iteration,
# so a crash leaves nothing the next iteration does not undo. Nothing else in
# this process touches them.
[[bin]]
name = "configuration"
path = "fuzz_targets/configuration.rs"
test = false
doc = false
bench = false

[[bin]]
name = "time_remaining"
path = "fuzz_targets/time_remaining.rs"
test = false
doc = false
bench = false

[[bin]]
name = "date_time"
path = "fuzz_targets/date_time.rs"
test = false
doc = false
bench = false

[[bin]]
name = "wildcard"
path = "fuzz_targets/wildcard.rs"
test = false
doc = false
bench = false

[[bin]]
name = "strnlen"
path = "fuzz_targets/strnlen.rs"
test = false
doc = false
bench = false

[[bin]]
name = "addr"
path = "fuzz_targets/addr.rs"
test = false
doc = false
bench = false

[[bin]]
name = "l2_policy"
path = "fuzz_targets/l2_policy.rs"
test = false
doc = false
bench = false

[[bin]]
name = "checksum"
path = "fuzz_targets/checksum.rs"
test = false
doc = false
bench = false

# Unlike most targets here this one drives stateful C: `packet.c` keeps a
# file-scope registry that `bm_wire_diff::bcmp` brings up once per process.
# Nothing accumulates between iterations, so the default in-process mode is
# fine -- see the module docs for why, and why bm_shim_reset must not be
# called here.
[[bin]]
name = "bcmp"
path = "fuzz_targets/bcmp.rs"
test = false
doc = false
bench = false

# This one brings bm_core's whole stack up, once per process, and drives it
# through the TX capture ring. Nothing accumulates between iterations by
# construction -- the virtual clock never advances so no timer fires, the L2
# queue is drained by each pump, and every buffer is freed -- so in-process
# running should be fine. If a crash proves otherwise, `-fork=1` is the fix:
# the stack's statics cannot be torn down, so a fresh process is the only way
# to get a clean one. It must not share a process with the `bcmp` target;
# see bm-wire-diff/src/l2_egress.rs for why.
[[bin]]
name = "l2_egress"
path = "fuzz_targets/l2_egress.rs"
test = false
doc = false
bench = false

# Stack-backed too, and subject to the same rule: it must not share a process
# with `bcmp`. Forwarding is the one comparison that spans both stages of the
# receive path, so this target injects a frame *and* calls bcmp_ll_forward for
# the same input. Nothing accumulates: heartbeats are outside the input domain
# precisely because bm_core's neighbour table would remember them -- see
# bm-wire-diff/src/forward.rs.
[[bin]]
name = "forward"
path = "fuzz_targets/forward.rs"
test = false
doc = false
bench = false

# Stack-backed as well, same rule. The system-time exchange is the first thing
# ported that makes bm_core forward a message rather than answer it, so this
# target exercises both outcomes plus `bm_rtc_set` moving the clock underneath
# them. Nothing accumulates: time.c has no module state, and the RTC is set
# afresh from the input before every injection -- see bm-wire-diff/src/time.rs.
[[bin]]
name = "time"
path = "fuzz_targets/time.rs"
test = false
doc = false
bench = false

# Also stack-backed, and subject to the same rule: it must not share a process
# with `bcmp`. It only ever hands bm_core well-formed requests -- see
# divergence #14 for why a malformed reply must not be injected -- and drives
# the decoders with the input's `decode_probe` bytes instead.
[[bin]]
name = "bcmp_messages"
path = "fuzz_targets/bcmp_messages.rs"
test = false
doc = false
bench = false

# Stack-backed as well, and under the same rule about `bcmp`. Ping is the one
# exchange this harness drives from both ends: it asks the oracle to ping and
# compares the request, then injects a request and compares the reply. Nothing
# accumulates -- `bcmp_send_ping_request` frees its buffer, ping is registered
# unsequenced so the C's sequence list never grows, and `EXPECTED_PAYLOAD` is
# one slot that each iteration overwrites -- so no fork mode. It does carry
# state forward on purpose: `ping.c`'s `BCMP_SEQ` and the Rust node's counter
# both advance once per iteration, and that they advance together is part of
# what is being compared. Only well-formed requests reach the C; see
# divergence #27 for why a lying `payload_len` must not be injected.
[[bin]]
name = "ping"
path = "fuzz_targets/ping.rs"
test = false
doc = false
bench = false

# Stack-backed like the two above, and the one target here that genuinely
# accumulates: every new neighbour makes bcmp_update_neighbor call
# bcmp_request_info, which appends to INFO_REQUEST_LIST with no de-duplication
# and no expiry (divergence #19). Bounded per iteration, unbounded across a
# run, so give this one fork mode:
#
#   cargo fuzz run neighbor corpus/neighbor seeds/neighbor -- -fork=1
[[bin]]
name = "neighbor"
path = "fuzz_targets/neighbor.rs"
test = false
doc = false
bench = false

# Drives `packet.c`'s sequenced-request machinery: the type registry, the
# outgoing sequence counter and the expiry timer. Like `bcmp` it owns
# `packet_init`, so it must not share a process with that target -- or with
# any of the stack-backed ones. It does not need `-fork=1`: the one thing
# that would accumulate is the C's sequence list, and every iteration ends by
# running the clock past the sweep and asserting the list is empty.
[[bin]]
name = "registry"
path = "fuzz_targets/registry.rs"
test = false
doc = false
bench = false

# Stack-backed, same rule about `bcmp`. It drives a whole `bm_stack::Node`
# alongside bm_core's stack, because the info cache is gated on the neighbour
# table and the requests it provokes are what divergence #34 is about. Give it
# fork mode: `INFO_REQUEST_LIST` never expires an entry (divergence #19), and
# although `check` answers everything it provoked before returning, a crash
# leaves the list behind.
#
#   cargo fuzz run info corpus/info seeds/info -- -fork=1
[[bin]]
name = "info"
path = "fuzz_targets/info.rs"
test = false
doc = false
bench = false

# Stack-backed, same rule about `bcmp`. The neighbour-table requester is the
# one exchange whose state is a single slot rather than a list, and the only
# one bm_core puts a real timer on, so this target advances the virtual clock
# to fire it. It does not need `-fork=1`: heartbeats are outside the input
# domain, so nothing appends to `INFO_REQUEST_LIST`, and `neighbors.c`'s three
# statics are put back by `reset_requester` at the start of every iteration
# rather than at the end -- so a crash leaves nothing behind that the next
# iteration does not undo.
[[bin]]
name = "neighbor_table"
path = "fuzz_targets/neighbor_table.rs"
test = false
doc = false
bench = false

# Stack-backed, same rule about `bcmp`. Resource discovery has no timer, so
# nothing here advances the clock; what it has instead is two lists with no
# remove, no clear and no deinit, so `PUB_LIST` and `SUB_LIST` grow across a
# run and the names a step may use come from a fixed pool. Give it fork mode:
# `RESOURCE_REQUEST_LIST` never expires an entry (divergence #19), and although
# `check` empties it at the start of every iteration, a crash leaves the two
# resource lists behind in a state the comparator's model no longer describes.
#
#   cargo fuzz run resource corpus/resource seeds/resource -- -fork=1
[[bin]]
name = "resource"
path = "fuzz_targets/resource.rs"
test = false
doc = false
bench = false
