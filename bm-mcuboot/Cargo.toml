[package]
name = "bm-mcuboot"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
license.workspace = true
description = "MCUboot v1.9.0's image header, TLV area and slot trailer: no_std, no alloc, no dependencies by default"

# No dependencies by default, and no SHA-256 or signing: the hash and
# signature an image carries are computed by `bm-image`.
[dependencies]
defmt = { version = "1", optional = true }

[features]
# `defmt::Format` on public types, for firmware logs.
defmt = ["dep:defmt"]
