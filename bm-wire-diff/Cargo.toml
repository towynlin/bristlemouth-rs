[package]
name = "bm-wire-diff"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
publish = false
description = "Differential harness comparing bm-wire against the real bm_core C"

[dependencies]
arbitrary = { version = "1", features = ["derive"] }
bm-stack = { path = "../bm-stack" }
embassy-futures = "0.1"
bm-wire = { path = "../bm-wire", features = ["std"] }
bm-wire-sys = { path = "../bm-wire-sys" }
cbor2 = { version = "1.1.5", default-features = false }
