# Weekly, grouped, and one entry per workspace -- the fuzz crate and the PHY
# are not reachable from the root lockfile.
#
# The PHY follows embassy main by git branch (see bm-phy-adin2111/Cargo.toml);
# dependabot bumps the locked commit. xarxa-driver is reached through
# embassy-net-driver-channel's re-export, so its rev moves with embassy.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo:
        patterns: ['*']

  - package-ecosystem: cargo
    directory: /bm-wire/fuzz
    schedule:
      interval: weekly
    groups:
      cargo:
        patterns: ['*']

  - package-ecosystem: cargo
    directory: /bm-phy-adin2111
    schedule:
      interval: weekly
    groups:
      cargo:
        patterns: ['*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
