# Weekly, grouped, and one entry per workspace -- the fuzz crate and the PHY
# are not reachable from the root lockfile.
#
# The PHY's embassy and xarxa dependencies are git-pinned deliberately (see
# bm-phy-adin2111/Cargo.toml); dependabot leaves those alone, so following
# embassy#7024 stays a manual `cargo update -p embassy-net-adin1110`.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo:
        patterns: ['*']

  - package-ecosystem: cargo
    directory: /bm-wire/fuzz
    schedule:
      interval: weekly
    groups:
      cargo:
        patterns: ['*']

  - package-ecosystem: cargo
    directory: /bm-phy-adin2111
    schedule:
      interval: weekly
    groups:
      cargo:
        patterns: ['*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
