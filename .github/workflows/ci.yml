# Everything CLAUDE.md's "Verifying" section runs by hand, run on every push.
#
# Four workspaces live here and none of them is reachable from the others:
# the root one, `bm-wire/fuzz`, and `bm-phy-adin2111` and `bm-devkit` (each
# with its own toolchain pin and git dependencies). Each needs its own
# invocation.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a PR cancels the run it supersedes; pushes to main all finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Nothing is reused across jobs, and the artefacts are large.
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal --component rustfmt --no-self-update
      - run: rustup default stable
      - name: Root workspace
        run: cargo fmt --all --check
      # `--all` stops at the workspace boundary, so the fuzz crate needs its
      # own pass. bm-phy-adin2111 is formatted in the job that installs its
      # pinned toolchain, below.
      - name: Fuzz workspace
        run: cargo fmt --all --check --manifest-path bm-wire/fuzz/Cargo.toml

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Not `submodules: recursive`. bm-wire-sys compiles vendor/bm_core,
      # whose own submodules (tinycbor, mavlink) are in the tier lists;
      # bm-mcuboot-sys compiles vendor/mcuboot, whose own submodules (mbedtls,
      # esp-idf, the Cypress libraries) it does not use.
      - name: Submodules
        run: |
          git submodule update --init --recursive --depth 1 bm-wire-sys/vendor/bm_core
          git submodule update --init --depth 1 bm-mcuboot-sys/vendor/mcuboot
      - name: libclang, for bindgen
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libclang-dev
      - run: rustup toolchain install stable --profile minimal --component clippy --no-self-update
      - run: rustup default stable
      - run: rustup target add thumbv8m.main-none-eabihf
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-clippy-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-clippy-
      - name: Host
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # The firmware view. The host lint above never compiles this cfg, and
      # bare-metal is where bm-wire and bm-stack actually have to hold up.
      - name: Cortex-M33
        run: cargo clippy -p bm-wire -p bm-stack -p bm-mcuboot --features bm-stack/channel --target thumbv8m.main-none-eabihf --locked -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Submodules
        run: |
          git submodule update --init --recursive --depth 1 bm-wire-sys/vendor/bm_core
          git submodule update --init --depth 1 bm-mcuboot-sys/vendor/mcuboot
      - name: libclang, for bindgen
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libclang-dev
      - run: rustup toolchain install stable --profile minimal --no-self-update
      - run: rustup default stable
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-test-
      # The differential tests and every committed fuzz seed.
      - name: Workspace
        run: cargo test --workspace --locked
      # `cargo test` builds examples but does not run them; this one asserts.
      - name: bm-stack example
        run: cargo run -p bm-stack --example hello_node --locked
      # bm-wire on its own, with `std` off, the way firmware gets it. The
      # workspace run above always has it on, through bm-wire-diff.
      - name: bm-wire, default features
        run: cargo test -p bm-wire --locked
      - name: Only libc left unresolved
        run: ./bm-wire-sys/scripts/check_symbols.sh --check
      # bm-wire-sys is left out on purpose: bindgen re-emits bm_core's own C
      # comments as doc comments, bare URLs and all, and rustdoc is right to
      # complain about prose this repo does not own.
      - name: Docs
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --all-features --locked -p bm-wire -p bm-stack -p bm-wire-diff -p bm-mcuboot-sys -p bm-mcuboot -p bm-mcuboot-diff -p bm-image

  embedded:
    name: bare-metal builds
    runs-on: ubuntu-latest
    # No submodules on purpose: if this job ever needs vendor/bm_core, the
    # oracle has leaked into a crate that must build for firmware without it.
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal --no-self-update
      - run: rustup default stable
      - run: rustup target add thumbv7em-none-eabihf thumbv8m.main-none-eabihf
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-embedded-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-embedded-
      - name: bm-wire (thumbv7em) -- no_std, alloc-free
        run: cargo build -p bm-wire --target thumbv7em-none-eabihf --locked
      - name: bm-wire (thumbv8m, the dev kit's Cortex-M33)
        run: cargo build -p bm-wire --target thumbv8m.main-none-eabihf --locked
      - name: bm-stack (thumbv8m)
        run: cargo build -p bm-stack --target thumbv8m.main-none-eabihf --locked
      - name: bm-mcuboot (thumbv7em)
        run: cargo build -p bm-mcuboot --target thumbv7em-none-eabihf --locked
      - name: bm-mcuboot (thumbv8m)
        run: cargo build -p bm-mcuboot --target thumbv8m.main-none-eabihf --locked

  msrv:
    name: msrv
    runs-on: ubuntu-latest
    # The floor `rust-version` declares, checked rather than asserted. The
    # other jobs run on latest stable, which is what embassy's README actually
    # promises; this one is what notices when a dependency outgrows the number
    # in the manifest. bm-phy-adin2111 needs no entry here -- its
    # rust-toolchain.toml already pins that same version, so its job below is
    # its own MSRV check.
    steps:
      - uses: actions/checkout@v7
      - name: Submodules
        run: |
          git submodule update --init --recursive --depth 1 bm-wire-sys/vendor/bm_core
          git submodule update --init --depth 1 bm-mcuboot-sys/vendor/mcuboot
      - name: libclang, for bindgen
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libclang-dev
      - name: Install the toolchain rust-version names
        id: msrv
        run: |
          msrv=$(sed -n 's/^rust-version *= *"\(.*\)"/\1/p' Cargo.toml)
          echo "declared MSRV: $msrv"
          rustup toolchain install "$msrv" --profile minimal --no-self-update
          echo "toolchain=$msrv" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-msrv-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-msrv-
      - run: cargo +${{ steps.msrv.outputs.toolchain }} check --workspace --all-targets --locked

  invariants:
    name: dependency invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal --no-self-update
      - run: rustup default stable
      # bm-wire's dependency set is a property of the crate, not an
      # aspiration: it is exactly cbor2 and what cbor2 pulls in, in every
      # configuration. Enabling `std` must not change it -- bm-wire's `std`
      # feature is a test marker and must never forward to cbor2, or firmware
      # and tests would run different code.
      - name: bm-wire depends on cbor2 and nothing else
        run: |
          expected='bm-wire cbor2 serde serde_core'
          for args in "" "--all-features"; do
            got=$(cargo tree --locked -p bm-wire $args --prefix none \
                    | awk 'NF {print $1}' | sort -u | tr '\n' ' ' | sed 's/ $//')
            if [ "$got" != "$expected" ]; then
              echo "::error::bm-wire's dependency set changed (cargo tree $args)"
              echo "  expected: $expected"
              echo "  got:      $got"
              exit 1
            fi
          done
      - name: bm-mcuboot has no dependencies
        run: |
          got=$(cargo tree --locked -p bm-mcuboot --all-features --prefix none \
                  | awk 'NF {print $1}' | sort -u | tr '\n' ' ' | sed 's/ $//')
          if [ "$got" != "bm-mcuboot" ]; then
            echo "::error::bm-mcuboot has dependencies: $got"
            exit 1
          fi
      # The host-only oracles must never be reachable from a crate that ships.
      - name: The oracles stay out of the firmware crates
        run: |
          status=0
          for pkg in bm-wire bm-stack bm-mcuboot; do
            for oracle in bm-wire-sys bm-mcuboot-sys; do
              if cargo tree --locked -p "$pkg" --all-features | grep -q "$oracle"; then
                echo "::error::$pkg reaches $oracle; the oracle would end up in firmware"
                status=1
              fi
            done
          done
          exit $status

  phy:
    name: bm-phy-adin2111
    runs-on: ubuntu-latest
    # Its own workspace, its own toolchain pin, and git dependencies rather
    # than crates.io ones -- so it needs network, and the root `cargo test`
    # never touches it. See CLAUDE.md for why it is kept separate.
    defaults:
      run:
        working-directory: bm-phy-adin2111
    steps:
      - uses: actions/checkout@v7
      - name: Install the toolchain rust-toolchain.toml pins
        run: |
          channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
          echo "pinned channel: $channel"
          rustup toolchain install "$channel" --profile minimal \
            --component rustfmt --component clippy \
            --target thumbv8m.main-none-eabihf --no-self-update
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            bm-phy-adin2111/target/
          key: ${{ runner.os }}-cargo-phy-${{ hashFiles('bm-phy-adin2111/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-phy-
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - run: cargo build --target thumbv8m.main-none-eabihf --locked

  devkit:
    name: bm-devkit
    runs-on: ubuntu-latest
    # Firmware for the dev kit: its own workspace, the same toolchain pin and
    # git embassy as bm-phy-adin2111, and only a cross build -- there is no
    # host target to test on. On-hardware checks are manual. No submodules:
    # bm-image is built without its tests, which are what need the oracle.
    defaults:
      run:
        working-directory: bm-devkit
    steps:
      - uses: actions/checkout@v7
      - name: Install the toolchain rust-toolchain.toml pins
        run: |
          channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
          echo "pinned channel: $channel"
          rustup toolchain install "$channel" --profile minimal \
            --component rustfmt --component clippy \
            --target thumbv8m.main-none-eabihf --no-self-update
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            bm-devkit/target/
          key: ${{ runner.os }}-cargo-devkit-${{ hashFiles('bm-devkit/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-devkit-
      - run: cargo fmt --all --check
      # `.cargo/config.toml` sets the target, so both run for the Cortex-M33.
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo build --locked
      - run: cargo build --release --locked
      # Every binary's `.dfu.bin`, the image the bootloader and DFU take.
      - run: ./build.sh --release
